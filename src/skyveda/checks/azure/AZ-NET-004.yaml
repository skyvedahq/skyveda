schema_version: 1
id: AZ-NET-004
title: Storage accounts deny public network access by default
provider: azure
area: network
severity: high
source:
  type: resource_graph
  query: |
    // Compliant when public network access is Disabled, or the firewall default action is Deny.
    // A missing publicNetworkAccess is read as Enabled and a missing defaultAction as Allow:
    // both are the Azure defaults, and both are open, so unknown data fails.
    resources
    | where type =~ 'microsoft.storage/storageaccounts'
    | extend publicNetworkAccess = coalesce(tostring(properties.publicNetworkAccess), 'Enabled'),
             defaultAction = coalesce(tostring(properties.networkAcls.defaultAction), 'Allow')
    | project id, name, resourceGroup, location, publicNetworkAccess, defaultAction,
              compliant = publicNetworkAccess =~ 'Disabled' or defaultAction =~ 'Deny'
why: >-
  A storage account whose firewall allows all networks can be reached from the Internet by anyone
  who holds a key or a token. A firewall that denies by default limits access to named networks.
fix:
  summary: Set the storage firewall to deny by default and allow only the networks that need it, or turn public access off.
  steps:
    - List who and what reaches the account today (applications, pipelines, admins).
    - Add private endpoints or virtual network rules for them, then set the default action to Deny.
    - Where private endpoints carry all access, set public network access to Disabled.
  cli: az storage account update -g <resource-group> -n <account> --default-action Deny
  terraform: |
    # azurerm_storage_account
    public_network_access_enabled = false
    network_rules {
      default_action = "Deny"
      bypass         = ["AzureServices"]
    }
references:
  - https://learn.microsoft.com/azure/storage/common/storage-network-security
frameworks:
  mcsb:
    - NS-2
  waf_pillar:
    - Security
  waf:
    - SE:06
